<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mockingword PDF翻訳</title>
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="../vendor/pdfjs/pdf_viewer.css">
  <style>
    /* PDF は pdf.js のビューアで表示し、ページの段落がそろうたびにそのページを訳したPDFのページに差し替える（docs/12_PDFの翻訳.md「表示」）。 */
    html, body { height: 100%; }
    body { margin: 0; display: flex; flex-direction: column; }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
    h1 { font-size: 18px; margin: 0 auto 0 0; }
    h1 img { width: 32px; height: 32px; }
    #status { font-size: 13px; color: var(--muted); min-width: 16em; }
    progress { width: 160px; }
    .group { display: flex; gap: 4px; }
    /* 操作のグループ（.tools）は、どれも左に縦の区切り線を持つ。並べる枠（.toolbar）が左端を 1px 外へはみ出させて切り取るので、
       行の頭（折り返した行の頭も）の区切り線だけが見えなくなり、グループの間にだけ線が残る。中身が全部隠れているグループは出さない。 */
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; row-gap: 8px; overflow: hidden; margin-inline-start: -12px; padding-block: 1px; }
    .tools { display: flex; align-items: center; gap: 4px; margin-inline-start: -1px; padding-inline: 12px 11px; border-inline-start: 1px solid var(--line); }
    .tools:not(:has(> :not([hidden]))) { display: none; }
    main { flex: 1; display: flex; min-height: 0; }
    /* 見出しの欄（しおりのツリー）。開閉は body.outline-open */
    #outline { width: 280px; flex: none; overflow: auto; border-right: 1px solid var(--line); padding: 8px 0; font-size: 13px; display: none; }
    .outline-open #outline { display: block; }
    #outline ul { list-style: none; margin: 0; padding: 0; }
    #outline li > ul { display: none; }
    #outline li.open > ul { display: block; }
    /* 開閉の矢印は見出しの1行目の高さ（--ol-line・--ol-pad から決まる）の真ん中に置く。共通のボタンの最小の高さは外す */
    .ol-row { --ol-line: 1.4; --ol-pad: 3px; display: flex; align-items: flex-start; gap: 2px; padding-right: 8px; }
    .ol-twist { flex: none; display: flex; align-items: center; justify-content: center; width: 22px; min-height: 0; height: calc(1em * var(--ol-line) + 2 * var(--ol-pad)); padding: 0; border: 0; background: none; color: var(--muted); }
    .ol-twist::before { content: '▶'; font-size: 11px; transition: transform .15s; }
    li.open > .ol-row > .ol-twist::before { transform: rotate(90deg); }
    .ol-twist:disabled::before { content: ''; }
    .ol-title { flex: 1; padding: var(--ol-pad) 4px; border-radius: 4px; color: inherit; text-decoration: none; line-height: var(--ol-line); }
    .ol-title:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
    /* 訳した見出しがあれば訳文、原文の表示では原文 */
    .ol-ja:empty, body:not(.mw-original) .ol-ja:not(:empty) + .ol-orig, .mw-original .ol-ja { display: none; }
    .ol-empty { margin: 8px 16px; color: var(--muted); }
    #view { flex: 1; position: relative; min-width: 0; }
    /* pdf.js のビューアは標準の大きさの測り方（content-box）が前提。共通の ui.css の *{box-sizing:border-box} が効くと、ページの絵だけが
       枠線の分小さくなり、文字の層・リンクの層との位置が下へ行くほどずれた（ページの下端で約1行。2026-11-17、作者の報告） */
    #viewerContainer, #viewerContainer *, #viewerContainer *::before, #viewerContainer *::after { box-sizing: content-box; }
    #viewerContainer { position: absolute; inset: 0; overflow: auto; background: var(--mw-surface-container); }
    #pick { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--muted); }
    #pick.drag { background: color-mix(in srgb, var(--accent) 8%, transparent); }
    /* 途中の訳文をページの上に重ねる。クリックと選択は下の pdf.js の層へ通す。 */
    .mw-layer { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; white-space: pre; opacity: 1; transition: opacity .25s ease; }
    .mw-layer.mw-fading { opacity: 0; }
    .mw-source-tail { opacity: .55; }
    .mw-original .mw-layer { display: none; }
    /* ページを訳したPDFのページに差し替える間、差し替える前の絵の写しを重ねる（ui/pdf-pages.js） */
    .mw-cover { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 4; pointer-events: none; }
    /* pdf.js の文字の層は透明な文字で選択範囲だけを見せる。共通の ::selection は文字に色を付けるので、ここでは透明に戻す
       （付けたままだと、選んだところで原文が二重に見える）。 */
    .textLayer ::selection { color: transparent; }
    [hidden] { display: none !important; }
  </style>
<script type="module" src="theme.js"></script>
</head>
<body class="mw-text">
  <header>
    <h1 class="brand"><img src="../icons/icon48.png" alt=""><span>Mocking<span class="brand-word">word</span></span><span class="screen-title">PDF翻訳</span><small class="app-version" data-app-version></small></h1>
    <span id="status" aria-live="polite"></span>
    <progress id="progress" hidden></progress>
    <!-- 操作は機能ごとのグループ（.tools）に分け、グループの間に区切り線を引く -->
    <div class="toolbar">
    <div class="tools" role="group" aria-label="移動">
      <button id="toggle-outline" title="見出しの一覧を開く・閉じる" aria-controls="outline">☰ 見出し</button>
      <button id="back" title="移る前の位置へ戻る（Alt+←）" disabled>← 戻る</button>
      <button id="forward" title="戻る前の位置へ進む（Alt+→）" disabled>進む →</button>
    </div>
    <div class="tools" role="group" aria-label="翻訳">
      <select id="target" aria-label="訳文の言語" title="訳文の言語。PDFに書ける言語を選べます（右から左に書く言語や、文字を組み合わせて書く言語は選べません）。訳した後に変えると、その言語で初めから訳し直します"></select>
      <button id="start" class="primary" hidden>翻訳を開始</button>
      <button id="stop" hidden>翻訳を中止</button>
      <div class="group" id="views" hidden>
        <button id="show-trans" class="primary">訳文</button>
        <button id="show-orig">原文</button>
      </div>
    </div>
    <div class="tools" role="group" aria-label="表示">
      <div class="group" id="zoom" hidden>
        <button id="zoom-out" title="縮小">－</button>
        <select id="scale" aria-label="表示の大きさ">
          <option value="page-width">幅に合わせる</option>
          <option value="page-height">高さに合わせる</option>
          <option value="page-actual">100%</option>
          <option value="custom" hidden></option>
        </select>
        <button id="zoom-in" title="拡大">＋</button>
        <select id="spread" aria-label="ページの並べ方">
          <option value="0" title="1ページずつ縦に並べる">1ページ</option>
          <option value="1" title="1・2ページ、3・4ページの組で並べる">見開き（奇数が左）</option>
          <option value="2" title="表紙を単独にし、2・3ページ、4・5ページの組で並べる">見開き（表紙を単独）</option>
        </select>
      </div>
    </div>
    <div class="tools" role="group" aria-label="ファイル">
      <button id="save" class="tonal" hidden>訳したPDFを保存</button>
      <button id="open">PDFを開く</button>
      <input id="file" type="file" accept="application/pdf,.pdf" hidden>
    </div>
    </div>
  </header>
  <main>
    <nav id="outline" aria-label="見出し"><div id="outline-tree"></div></nav>
    <div id="view">
      <div id="viewerContainer" hidden><div id="viewer" class="pdfViewer"></div></div>
      <div id="pick">
        <p>訳したいPDFをここへドラッグするか、「PDFを開く」で選んでください。</p>
      </div>
    </div>
  </main>
  <script src="pdf.js" type="module"></script>
</body>
</html>
