<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mockingword テキスト翻訳</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    /* 広い画面では左右いっぱいに近く使い、長い文章を見通せるようにする（2026-11-12、作者の依頼。以前は1200pxで左右の余白が大きかった）。 */
    body { margin: 0; padding: 16px 24px; }
    main { max-width: 2400px; margin: 0 auto; }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 12px; }
    h1 { font-size: 18px; margin: 0 auto 0 0; }
    .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 720px) { .panes { grid-template-columns: 1fr; } }
    /* 欄は窓の高さいっぱいから始め、文章が長ければ両方の欄を同じ高さまで伸ばす（ページ全体をスクロールして原文と訳文を並べて読む）。 */
    .pane { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); min-height: max(320px, calc(100vh - 100px)); }
    .pane-head { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--line); }
    .pane-head .grow { flex: 1; }
    textarea, #output {
      flex: 1; box-sizing: border-box; width: 100%; padding: 12px; border: 0; background: transparent;
      font-size: 16px; line-height: 1.7; resize: none; outline: none; white-space: pre-wrap; overflow-wrap: anywhere;
    }
    /* 入れた文章の長さに合わせて高さを変える（貼り付けた直後から原文全体が見え、訳を待たずに欄が伸びる）。 */
    textarea { field-sizing: content; min-height: 8em; }
    #output.placeholder { color: var(--muted); }
    .pane-foot { padding: 4px 10px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); min-height: 1.6em; }
    #notice { font-size: 12px; color: var(--muted); }
  </style>
<script type="module" src="theme.js"></script>
</head>
<body class="mw-text">
  <main>
    <header>
      <h1 class="brand"><img src="../icons/icon48.png" alt=""><span>Mocking<span class="brand-word">word</span></span><span class="screen-title">テキスト翻訳</span><small class="app-version" data-app-version></small></h1>
      <span id="notice"></span>
      <label>文体
        <select id="form">
          <option value="polite">です・ます</option>
          <option value="plain">だ・である</option>
        </select>
      </label>
      <button id="options">設定</button>
    </header>
    <div class="panes">
      <section class="pane">
        <div class="pane-head">
          <select id="source" class="grow" aria-label="原文の言語"></select>
          <button id="paste" title="クリップボードの文字を入力欄へ貼り付ける">貼り付け</button>
          <button id="clear" title="消す">消す</button>
        </div>
        <textarea id="input" placeholder="訳したい文章を入れてください（入力が止まると訳します。Ctrl+Enter ですぐ訳す）" autofocus></textarea>
        <div class="pane-foot" id="count">0 字</div>
      </section>
      <section class="pane">
        <div class="pane-head">
          <span class="grow">日本語</span>
          <button id="translate" class="primary">翻訳</button>
          <button id="copy">コピー</button>
        </div>
        <div id="output" class="placeholder" aria-live="polite">訳文がここに出ます</div>
        <div class="pane-foot" id="foot"></div>
      </section>
    </div>
  </main>
  <script src="translate.js" type="module"></script>
</body>
</html>
